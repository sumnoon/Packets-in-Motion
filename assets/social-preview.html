<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of social-preview.png (1280 × 640). See BRAND.md for how to re-render it. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{background:#04060d;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#e7ecf5;position:relative}
  .fog{position:absolute;border-radius:50%;filter:blur(10px)}
  .stars{position:absolute;inset:0;background-image:
    radial-gradient(1.4px 1.4px at 7% 12%,#ffffff55 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 80%,#ffffff44 50%,transparent 51%),
    radial-gradient(1.6px 1.6px at 38% 8%,#ffffff40 50%,transparent 51%),radial-gradient(1.2px 1.2px at 46% 92%,#ffffff40 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 3% 58%,#ffffff35 50%,transparent 51%),radial-gradient(1.2px 1.2px at 30% 66%,#ffffff30 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 52% 30%,#ffffff40 50%,transparent 51%),radial-gradient(1.2px 1.2px at 62% 5%,#ffffff40 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 97% 9%,#ffffff40 50%,transparent 51%),radial-gradient(1.2px 1.2px at 94% 95%,#ffffff35 50%,transparent 51%),
    radial-gradient(1.3px 1.3px at 16% 35%,#ffffff30 50%,transparent 51%),radial-gradient(1.3px 1.3px at 50% 55%,#ffffff2a 50%,transparent 51%)}
  .left{position:absolute;left:70px;top:168px;width:640px}
  h1{font-size:68px;font-weight:700;letter-spacing:-1.5px;line-height:1;white-space:nowrap}
  .sub{margin-top:20px;font-size:29px;line-height:1.3;color:#c9d2e3;font-weight:400}
  .pills{display:flex;flex-wrap:nowrap;gap:10px;margin-top:32px}
  .pill{font-size:15px;font-weight:600;padding:7px 13px;border-radius:999px;border:1.5px solid}
  .v{color:#c4b5fd;border-color:#a78bfa88;background:#a78bfa1f}
  .a{color:#fcd34d;border-color:#fbbf2488;background:#fbbf241a}
  .b{color:#7cbcff;border-color:#4ea1ff88;background:#4ea1ff1a}
  .foot{margin-top:30px;font-size:16px;color:#8f9ab0}
  .shot{position:absolute;left:722px;top:118px;width:500px;border-radius:18px;overflow:hidden;border:1px solid #3b4a69;
    box-shadow:0 0 0 1px #00000060,0 24px 70px #000000aa,0 0 80px #4ea1ff22}
  /* a crop of lab-screenshot.png: the load balancer, the app servers (one crashed), the cache and the queue */
  .shot{height:354px}
  .shot img{display:block;width:1004px;margin:-68px 0 0 -250px}
  .tag{position:absolute;left:722px;top:86px;font-size:15px;font-weight:700;letter-spacing:.4px;color:#f87171;font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
  .tag span{color:#8f9ab0;font-weight:600}
  .legend{position:absolute;left:732px;top:500px;display:flex;gap:26px;font-size:15px;color:#a9b3c7}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px}
</style></head>
<body>
  <div class="fog" style="left:-120px;top:-160px;width:620px;height:520px;background:radial-gradient(closest-side,rgba(90,64,150,.30),transparent)"></div>
  <div class="fog" style="left:560px;top:120px;width:820px;height:620px;background:radial-gradient(closest-side,rgba(44,66,130,.34),transparent)"></div>
  <div class="stars"></div>
  <div class="left">
    <h1>Packets in Motion</h1>
    <p class="sub">System design, explained<br>by watching it happen.</p>
    <div class="pills"><span class="pill v">45 animated lessons</span><span class="pill a">a challenge for each</span><span class="pill b">10 build-it-yourself labs</span></div>
    <p class="foot">One offline HTML file · no install</p>
  </div>
  <div class="tag">ARCHITECTURE LAB <span>· your design, under load</span></div>
  <div class="shot"><img src="lab-screenshot.png" alt=""></div>
  <div class="legend"><span><i style="background:#4ea1ff"></i>request</span><span><i style="background:#34d399"></i>response</span><span><i style="background:#f87171"></i>failure</span><span><i style="background:#fbbf24"></i>cached / queued</span></div>
</body></html>
